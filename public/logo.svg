<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Institute for Latent Publics</title>
  <style>
    .ink { fill: #16181d; stroke: #16181d; }
    @media (prefers-color-scheme: dark) { .ink { fill: #e8eaee; stroke: #e8eaee; } }
    /* Declared after .ink so the unfilled circles stay unfilled: a presentation
       attribute (fill="none") loses to any class rule, so it cannot do this on
       its own. */
    .ring { fill: none; }
  </style>
  <circle cx="28" cy="28" r="9" class="ink"></circle>
  <circle cx="60" cy="28" r="9" class="ink ring" fill="none" stroke-width="2.5"></circle>
  <circle cx="92" cy="28" r="9" class="ink ring" fill="none" stroke-width="2.5"></circle>
  <circle cx="28" cy="60" r="9" class="ink"></circle>
  <circle cx="60" cy="60" r="9" fill="#D98E32"></circle>
  <circle cx="92" cy="60" r="9" class="ink ring" fill="none" stroke-width="2.5"></circle>
  <circle cx="28" cy="92" r="9" class="ink"></circle>
  <circle cx="60" cy="92" r="9" class="ink"></circle>
  <circle cx="92" cy="92" r="9" class="ink ring" fill="none" stroke-width="2.5"></circle>
</svg>
