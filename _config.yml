# 이 파일은 Cloudflare가 아니라 GitHub Pages를 위한 것이다. 지우지 말 것.
#
# latentpublics.com은 Cloudflare Worker가 서빙하지만, 그 Worker가
# /urban-currents/* 요청을 https://latentpublics.github.io/urban-currents/ 로
# 프록시하기 때문에 이 저장소의 GitHub Pages는 계속 켜져 있어야 한다.
# 아래 exclude는 그 호스트에 랜딩페이지·국문 페이지·Worker 소스가
# 중복 노출되지 않게 막는다. Cloudflare는 이 파일을 읽지 않는다.
exclude:
  - ko
  - public
  - src
  - prompts
  - node_modules
  - wrangler.jsonc
  - package.json
  - package-lock.json
